<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <style>
      .bd-bg { fill: #ffffff; }
      .bd-frame { fill: none; stroke: #0D1B2E; stroke-width: 3.5; stroke-linejoin: round; }
      .bd-panel-bg { fill: #f8fafc; }
      .bd-text { font-family: 'Gaegu', 'Comic Sans MS', cursive, sans-serif; fill: #0D1B2E; }
      .bd-cap-bg { fill: #FFD100; stroke: #0D1B2E; stroke-width: 2; }
      .bd-cap-txt { font-family: 'Lexend', sans-serif; font-size: 11px; font-weight: 600; fill: #0D1B2E; }
      .bd-bubble { fill: #ffffff; stroke: #0D1B2E; stroke-width: 2.5; stroke-linejoin: round; }
      .bd-bubble-txt { font-family: 'Lexend', sans-serif; font-size: 11px; font-weight: 500; fill: #0D1B2E; }
      .bd-fx { font-family: 'Avenir Heavy', 'Impact', sans-serif; font-weight: 900; }
    </style>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="studioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2E"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Page Background -->
  <rect width="600" height="800" class="bd-bg"/>

  <!-- Comic Header -->
  <text x="30" y="25" font-family="'Lexend', sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1.5">CLAP ! STUDIO · LES AVENTURES DU SON</text>
  <text x="570" y="25" font-family="'Lexend', sans-serif" font-size="10" font-weight="700" fill="#64748B" text-anchor="end">PLANCHE 01</text>
  <line x1="30" y1="32" x2="570" y2="32" stroke="#CBD5E1" stroke-width="1"/>

  <!-- ================= CASE 1 (Grande case d'ouverture) ================= -->
  <g transform="translate(30, 42)">
    <rect width="540" height="210" class="bd-panel-bg" rx="4"/>
    <rect width="540" height="210" fill="url(#skyGrad)" opacity="0.3" rx="4"/>
    
    <!-- Building & Studio exterior / interior -->
    <path d="M 0,160 L 540,160 L 540,210 L 0,210 Z" fill="#94A3B8" opacity="0.4"/>
    <!-- Studio Windows with Warm Light -->
    <rect x="60" y="50" width="130" height="90" fill="url(#warmGrad)" stroke="#0D1B2E" stroke-width="2.5" rx="3"/>
    <line x1="125" y1="50" x2="125" y2="140" stroke="#0D1B2E" stroke-width="2"/>
    <line x1="60" y1="95" x2="190" y2="95" stroke="#0D1B2E" stroke-width="2"/>
    <!-- Neon Sign "CLAP ! STUDIO" -->
    <g transform="translate(240, 60)">
      <rect x="0" y="0" width="240" height="50" rx="8" fill="#0D1B2E"/>
      <rect x="4" y="4" width="232" height="42" rx="6" fill="#FFD100"/>
      <text x="120" y="32" font-family="'Avenir Heavy', sans-serif" font-size="22" font-weight="900" fill="#0D1B2E" text-anchor="middle" letter-spacing="2">CLAP ! STUDIO</text>
    </g>

    <!-- Morning Sun / Clouds -->
    <circle cx="500" cy="40" r="24" fill="#FFD100" opacity="0.6"/>
    <path d="M 430,45 Q 450,30 475,45 Q 500,30 520,45 Z" fill="#FFFFFF" opacity="0.8"/>

    <!-- Sound Notes Floating in Air -->
    <g fill="#0D1B2E" opacity="0.7">
      <path d="M 170,40 Q 185,25 200,35 L 200,45 Q 185,35 170,48 Z"/>
      <circle cx="170" cy="48" r="4"/>
      <circle cx="200" cy="43" r="4"/>
      <path d="M 330,130 Q 345,115 360,125 L 360,135 Q 345,125 330,138 Z"/>
      <circle cx="330" cy="138" r="4"/>
      <circle cx="360" cy="133" r="4"/>
    </g>

    <!-- Narrative Caption Box -->
    <rect x="15" y="15" width="270" height="26" rx="3" class="bd-cap-bg"/>
    <text x="25" y="32" class="bd-cap-txt">Matin calme au studio... Tout est prêt pour la séance.</text>

    <!-- Frame border -->
    <rect width="540" height="210" class="bd-frame" rx="4"/>
  </g>

  <!-- ================= CASE 2 (Personnage au micro) ================= -->
  <g transform="translate(30, 268)">
    <rect width="258" height="240" class="bd-panel-bg" rx="4"/>
    <rect width="258" height="240" fill="url(#warmGrad)" opacity="0.4" rx="4"/>
    
    <!-- Sound booth acoustic panels -->
    <g stroke="#CBD5E1" stroke-width="1.5" opacity="0.6">
      <line x1="30" y1="0" x2="30" y2="240"/>
      <line x1="70" y1="0" x2="70" y2="240"/>
      <line x1="110" y1="0" x2="110" y2="240"/>
      <line x1="150" y1="0" x2="150" y2="240"/>
    </g>

    <!-- Microphone Vintage on stand -->
    <g transform="translate(160, 60)">
      <line x1="25" y1="80" x2="25" y2="180" stroke="#0D1B2E" stroke-width="5"/>
      <ellipse cx="25" cy="50" rx="18" ry="26" fill="#94A3B8" stroke="#0D1B2E" stroke-width="3"/>
      <rect x="14" y="38" width="22" height="24" fill="#0D1B2E" rx="3"/>
      <circle cx="25" cy="50" r="10" fill="#FFD100"/>
    </g>

    <!-- Character Silhouette with headphones -->
    <g transform="translate(40, 70)">
      <!-- Headphone band -->
      <path d="M 25,35 Q 55,10 85,35" fill="none" stroke="#0D1B2E" stroke-width="7"/>
      <!-- Headphone cups -->
      <rect x="18" y="30" width="14" height="26" rx="6" fill="#FFD100" stroke="#0D1B2E" stroke-width="3"/>
      <rect x="78" y="30" width="14" height="26" rx="6" fill="#FFD100" stroke="#0D1B2E" stroke-width="3"/>
      <!-- Face profile -->
      <circle cx="55" cy="52" r="32" fill="#FED7AA" stroke="#0D1B2E" stroke-width="3"/>
      <circle cx="68" cy="48" r="4" fill="#0D1B2E"/>
      <path d="M 64,62 Q 74,72 82,62" fill="none" stroke="#0D1B2E" stroke-width="3" stroke-linecap="round"/>
      <!-- Body / Hoodie -->
      <path d="M 15,140 Q 55,90 95,140 L 105,170 L 5,170 Z" fill="#0D1B2E"/>
      <polygon points="45,98 55,115 65,98" fill="#FFD100"/>
    </g>

    <!-- Speech Bubble -->
    <g transform="translate(20, 15)">
      <path d="M 0,0 L 195,0 Q 205,0 205,10 L 205,45 Q 205,55 195,55 L 75,55 L 55,70 L 62,55 L 10,55 Q 0,55 0,45 Z" class="bd-bubble" filter="url(#shadow)"/>
      <text x="15" y="24" class="bd-bubble-txt" font-weight="700">Casque sur les oreilles...</text>
      <text x="15" y="42" class="bd-bubble-txt">Je lance le décompte !</text>
    </g>

    <!-- Onomatopoeia -->
    <text x="195" y="225" class="bd-fx" font-size="18" fill="#EA580C" transform="rotate(-8, 195, 225)">CLIC !</text>

    <!-- Frame border -->
    <rect width="258" height="240" class="bd-frame" rx="4"/>
  </g>

  <!-- ================= CASE 3 (Table de mixage & explosion son) ================= -->
  <g transform="translate(312, 268)">
    <rect width="258" height="240" class="bd-panel-bg" rx="4"/>
    <rect width="258" height="240" fill="url(#studioGrad)" rx="4"/>

    <!-- Sound board faders -->
    <g stroke="#475569" stroke-width="3">
      <line x1="40" y1="130" x2="40" y2="210"/>
      <line x1="85" y1="130" x2="85" y2="210"/>
      <line x1="130" y1="130" x2="130" y2="210"/>
      <line x1="175" y1="130" x2="175" y2="210"/>
      <line x1="220" y1="130" x2="220" y2="210"/>
    </g>

    <!-- Fader Knobs (Yellow & White) -->
    <rect x="30" y="150" width="20" height="12" rx="3" fill="#FFD100" stroke="#0D1B2E" stroke-width="2"/>
    <rect x="75" y="170" width="20" height="12" rx="3" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
    <rect x="120" y="140" width="20" height="12" rx="3" fill="#FFD100" stroke="#0D1B2E" stroke-width="2"/>
    <rect x="165" y="160" width="20" height="12" rx="3" fill="#FFFFFF" stroke="#0D1B2E" stroke-width="2"/>
    <rect x="210" y="145" width="20" height="12" rx="3" fill="#FFD100" stroke="#0D1B2E" stroke-width="2"/>

    <!-- Sound Explosion Burst -->
    <g transform="translate(130, 65)">
      <!-- Starburst -->
      <polygon points="0,-45 14,-15 45,-25 25,0 48,22 15,18 0,48 -15,18 -48,22 -25,0 -45,-25 -14,-15" fill="#FFD100" stroke="#0D1B2E" stroke-width="3"/>
      <!-- Giant Sound FX -->
      <text x="0" y="10" font-family="'Avenir Heavy', 'Impact', sans-serif" font-size="28" font-weight="900" fill="#0D1B2E" text-anchor="middle" letter-spacing="1">CLAP !</text>
    </g>

    <!-- VU-meters lights -->
    <g transform="translate(20, 18)">
      <rect x="0" y="0" width="8" height="4" fill="#22C55E"/>
      <rect x="12" y="0" width="8" height="4" fill="#22C55E"/>
      <rect x="24" y="0" width="8" height="4" fill="#22C55E"/>
      <rect x="36" y="0" width="8" height="4" fill="#EAB308"/>
      <rect x="48" y="0" width="8" height="4" fill="#EF4444"/>
    </g>

    <!-- Frame border -->
    <rect width="258" height="240" class="bd-frame" rx="4"/>
  </g>

  <!-- ================= CASE 4 (Grande case finale chorale) ================= -->
  <g transform="translate(30, 524)">
    <rect width="540" height="230" class="bd-panel-bg" rx="4"/>
    
    <!-- Action Speed Lines Background -->
    <g stroke="#E2E8F0" stroke-width="2" opacity="0.7">
      <line x1="270" y1="115" x2="0" y2="0"/>
      <line x1="270" y1="115" x2="100" y2="0"/>
      <line x1="270" y1="115" x2="270" y2="0"/>
      <line x1="270" y1="115" x2="440" y2="0"/>
      <line x1="270" y1="115" x2="540" y2="0"/>
      <line x1="270" y1="115" x2="540" y2="100"/>
      <line x1="270" y1="115" x2="540" y2="230"/>
      <line x1="270" y1="115" x2="0" y2="230"/>
      <line x1="270" y1="115" x2="0" y2="100"/>
    </g>

    <!-- Singing Group / Characters -->
    <!-- Left character (Kid jumping) -->
    <g transform="translate(70, 70)">
      <circle cx="40" cy="35" r="24" fill="#FDE047" stroke="#0D1B2E" stroke-width="3"/>
      <!-- Eyes open with joy -->
      <path d="M 28,32 Q 35,26 40,32" fill="none" stroke="#0D1B2E" stroke-width="3" stroke-linecap="round"/>
      <path d="M 44,32 Q 50,26 55,32" fill="none" stroke="#0D1B2E" stroke-width="3" stroke-linecap="round"/>
      <!-- Singing mouth open -->
      <ellipse cx="40" cy="46" rx="8" ry="10" fill="#EF4444" stroke="#0D1B2E" stroke-width="2.5"/>
      <!-- Body -->
      <path d="M 20,60 L 60,60 L 52,120 L 28,120 Z" fill="#0284C7" stroke="#0D1B2E" stroke-width="3"/>
      <!-- Arms raised up -->
      <line x1="20" y1="70" x2="-5" y2="40" stroke="#0D1B2E" stroke-width="5" stroke-linecap="round"/>
      <line x1="60" y1="70" x2="85" y2="40" stroke="#0D1B2E" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Center character (Singer / Director) -->
    <g transform="translate(225, 45)">
      <circle cx="45" cy="40" r="28" fill="#FED7AA" stroke="#0D1B2E" stroke-width="3"/>
      <circle cx="36" cy="36" r="4" fill="#0D1B2E"/>
      <circle cx="56" cy="36" r="4" fill="#0D1B2E"/>
      <!-- Big wide smile -->
      <path d="M 32,50 Q 46,68 60,50 Z" fill="#EF4444" stroke="#0D1B2E" stroke-width="2.5"/>
      <!-- Body with suit / hoodie -->
      <path d="M 15,70 L 75,70 L 85,155 L 5,155 Z" fill="#0D1B2E" stroke="#0D1B2E" stroke-width="3"/>
      <!-- Tie / Scarf in Yellow -->
      <polygon points="40,70 50,70 52,110 45,120 38,110" fill="#FFD100"/>
    </g>

    <!-- Right character (Artist / Guitarist) -->
    <g transform="translate(390, 65)">
      <circle cx="40" cy="35" r="24" fill="#FBCFE8" stroke="#0D1B2E" stroke-width="3"/>
      <circle cx="32" cy="32" r="3.5" fill="#0D1B2E"/>
      <circle cx="48" cy="32" r="3.5" fill="#0D1B2E"/>
      <path d="M 32,45 Q 40,55 48,45" fill="none" stroke="#0D1B2E" stroke-width="3" stroke-linecap="round"/>
      <path d="M 15,60 L 65,60 L 60,125 L 20,125 Z" fill="#EA580C" stroke="#0D1B2E" stroke-width="3"/>
      <!-- Guitar or notebook -->
      <rect x="25" y="75" width="45" height="35" rx="5" fill="#FFD100" stroke="#0D1B2E" stroke-width="2.5"/>
      <circle cx="47" cy="92" r="7" fill="#0D1B2E"/>
    </g>

    <!-- Main Big Dialogue Bubble -->
    <g transform="translate(130, 10)">
      <path d="M 0,0 L 280,0 Q 290,0 290,10 L 290,40 Q 290,50 280,50 L 170,50 L 155,68 L 150,50 L 10,50 Q 0,50 0,40 Z" class="bd-bubble" filter="url(#shadow)"/>
      <text x="145" y="24" font-family="'Lexend', sans-serif" font-size="12" font-weight="700" fill="#0D1B2E" text-anchor="middle">Silence sur le plateau...</text>
      <text x="145" y="42" font-family="'Avenir Heavy', sans-serif" font-size="13" font-weight="900" fill="#EA580C" text-anchor="middle">TROIS, DEUX, UN... ET ACTION ! ♫</text>
    </g>

    <!-- Floating music notes -->
    <text x="40" y="50" font-size="24" fill="#0284C7">♪</text>
    <text x="500" y="70" font-size="28" fill="#FFD100">♫</text>
    <text x="470" y="160" font-size="20" fill="#EA580C">♩</text>

    <!-- Bottom border & page number -->
    <rect width="540" height="230" class="bd-frame" rx="4"/>
  </g>

  <!-- Page footer numbering -->
  <text x="300" y="780" font-family="'Lexend', sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">— 1 —</text>
</svg>

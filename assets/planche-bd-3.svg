<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <style>
      .bd-bg { fill: #FFFBEB; }
      .bd-frame { fill: none; stroke: #1E293B; stroke-width: 3.5; stroke-linejoin: round; }
      .bd-panel-bg { fill: #FEF3C7; }
      .bd-cap-bg { fill: #F59E0B; stroke: #1E293B; stroke-width: 2; }
      .bd-cap-txt { font-family: 'Lexend', sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B; }
      .bd-bubble { fill: #FFFFFF; stroke: #1E293B; stroke-width: 2.5; stroke-linejoin: round; }
      .bd-bubble-txt { font-family: 'Lexend', sans-serif; font-size: 11px; font-weight: 600; fill: #1E293B; }
      .bd-fx { font-family: 'Avenir Heavy', 'Impact', sans-serif; font-weight: 900; }
    </style>
    <linearGradient id="labGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <linearGradient id="magicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Cream BD page background -->
  <rect width="600" height="800" class="bd-bg"/>

  <!-- Header -->
  <text x="30" y="25" font-family="'Lexend', sans-serif" font-size="10" font-weight="700" fill="#78350F" letter-spacing="1.5">LE CONJUGARIUM · L'ATELIER DES VERBES MAGIQUES</text>
  <text x="570" y="25" font-family="'Lexend', sans-serif" font-size="10" font-weight="700" fill="#D97706" text-anchor="end">PLANCHE 03</text>
  <line x1="30" y1="32" x2="570" y2="32" stroke="#FDE68A" stroke-width="1.5"/>

  <!-- ================= CASE 1 (Le laboratoire de Madame Javel) ================= -->
  <g transform="translate(30, 42)">
    <rect width="540" height="210" fill="url(#labGrad)" rx="4"/>

    <!-- Chalkboard on the back wall -->
    <rect x="180" y="20" width="220" height="80" rx="4" fill="#065F46" stroke="#92400E" stroke-width="4"/>
    <text x="290" y="50" font-family="'Gaegu', cursive, sans-serif" font-size="18" font-weight="700" fill="#F0FDF4" text-anchor="middle">VERBE DU 3e GROUPE :</text>
    <text x="290" y="80" font-family="'Avenir Heavy', sans-serif" font-size="20" font-weight="900" fill="#FDE047" text-anchor="middle">P-O-U-V-O-I-R</text>

    <!-- Steaming Cauldron -->
    <g transform="translate(60, 110)">
      <ellipse cx="50" cy="80" rx="45" ry="18" fill="#1E293B"/>
      <path d="M 10,80 Q 5,110 50,110 Q 95,110 90,80 Z" fill="#1E293B"/>
      <!-- Bubbling potion inside -->
      <ellipse cx="50" cy="80" rx="40" ry="14" fill="#A855F7"/>
      <circle cx="35" cy="76" r="6" fill="#F472B6"/>
      <circle cx="65" cy="82" r="5" fill="#E879F9"/>
      <!-- Steam bubbles with letters -->
      <g transform="translate(0, -60)">
        <circle cx="30" cy="40" r="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
        <text x="30" y="44" font-family="'Lexend', sans-serif" font-size="9" font-weight="700" fill="#1E293B" text-anchor="middle">-ONS</text>
        <circle cx="70" cy="20" r="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
        <text x="70" y="25" font-family="'Lexend', sans-serif" font-size="10" font-weight="700" fill="#1E293B" text-anchor="middle">-IEZ</text>
      </g>
    </g>

    <!-- Madame Javel Character with Feather Pen -->
    <g transform="translate(420, 45)">
      <!-- Bun Hair -->
      <circle cx="45" cy="25" r="16" fill="#451A03"/>
      <!-- Head -->
      <circle cx="45" cy="48" r="22" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5"/>
      <!-- Glasses -->
      <circle cx="38" cy="45" r="7" fill="none" stroke="#D97706" stroke-width="2"/>
      <circle cx="54" cy="45" r="7" fill="none" stroke="#D97706" stroke-width="2"/>
      <line x1="45" y1="45" x2="47" y2="45" stroke="#D97706" stroke-width="2"/>
      <!-- Smile -->
      <path d="M 40,56 Q 46,62 52,56" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
      <!-- Dress -->
      <path d="M 25,70 L 65,70 L 75,150 L 15,150 Z" fill="#7C3AED" stroke="#1E293B" stroke-width="2.5"/>
      <rect x="28" y="70" width="34" height="75" fill="#FDF4FF"/>
      <!-- Feather Pen in Hand -->
      <path d="M 15,95 Q -5,60 0,40 Q 15,65 20,85 Z" fill="#F59E0B" stroke="#1E293B" stroke-width="2"/>
    </g>

    <!-- Dialogue Bubble -->
    <g transform="translate(200, 115)">
      <path d="M 0,0 L 210,0 Q 220,0 220,10 L 220,55 Q 220,65 210,65 L 180,65 L 195,85 L 165,65 L 10,65 Q 0,65 0,55 Z" class="bd-bubble"/>
      <text x="15" y="24" class="bd-bubble-txt" font-weight="700">Mélangez le radical...</text>
      <text x="15" y="42" class="bd-bubble-txt">Ajoutez la terminaison...</text>
      <text x="15" y="58" class="bd-bubble-txt" fill="#D97706">Et surtout : pas de faute d'accord !</text>
    </g>

    <!-- Caption -->
    <rect x="15" y="15" width="140" height="24" rx="3" class="bd-cap-bg"/>
    <text x="25" y="31" class="bd-cap-txt">Laboratoire n°4</text>

    <!-- Frame -->
    <rect width="540" height="210" class="bd-frame" rx="4"/>
  </g>

  <!-- ================= CASE 2 (Justin Chandelle affolé) ================= -->
  <g transform="translate(30, 268)">
    <rect width="258" height="240" fill="#FEF3C7" rx="4"/>

    <!-- Flying runaway verb letters -->
    <g transform="translate(140, 40)">
      <rect x="0" y="0" width="90" height="40" rx="8" fill="#EF4444" stroke="#1E293B" stroke-width="2" transform="rotate(15)"/>
      <text x="45" y="26" font-family="'Avenir Heavy', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" transform="rotate(15)">ILS PEUVENT</text>
      <!-- wings on letter -->
      <path d="M -15,10 Q -30,0 -20,25 Q -10,20 -5,20 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/>
      <path d="M 85,15 Q 105,5 100,30 Q 88,25 80,22 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/>
    </g>

    <!-- Justin hiding behind a stack of books -->
    <g transform="translate(40, 110)">
      <!-- Books stack -->
      <rect x="0" y="60" width="80" height="18" rx="2" fill="#0284C7" stroke="#1E293B" stroke-width="2"/>
      <rect x="5" y="42" width="72" height="18" rx="2" fill="#EA580C" stroke="#1E293B" stroke-width="2"/>
      <rect x="10" y="24" width="65" height="18" rx="2" fill="#16A34A" stroke="#1E293B" stroke-width="2"/>
      <!-- Justin head peeking out -->
      <circle cx="45" cy="5" r="20" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5"/>
      <circle cx="38" cy="2" r="3" fill="#1E293B"/>
      <circle cx="52" cy="2" r="3" fill="#1E293B"/>
      <!-- Worried mouth O -->
      <ellipse cx="45" cy="14" rx="4" ry="6" fill="#1E293B"/>
      <!-- Hat / Hair -->
      <path d="M 25,-8 Q 45,-25 65,-8 Z" fill="#F59E0B" stroke="#1E293B" stroke-width="2"/>
    </g>

    <!-- Speech bubble -->
    <g transform="translate(15, 15)">
      <path d="M 0,0 L 140,0 Q 150,0 150,10 L 150,50 Q 150,60 140,60 L 50,60 L 35,75 L 40,60 L 10,60 Q 0,60 0,50 Z" class="bd-bubble"/>
      <text x="12" y="24" class="bd-bubble-txt" font-weight="700">Au secours !</text>
      <text x="12" y="42" class="bd-bubble-txt">Un verbe irrégulier</text>
      <text x="12" y="55" class="bd-bubble-txt">s'est échappé !</text>
    </g>

    <!-- Frame -->
    <rect width="258" height="240" class="bd-frame" rx="4"/>
  </g>

  <!-- ================= CASE 3 (Mister A intervient) ================= -->
  <g transform="translate(312, 268)">
    <rect width="258" height="240" fill="#EDE9FE" rx="4"/>

    <!-- Swinging rope / cable -->
    <path d="M 240,0 Q 160,80 120,130" fill="none" stroke="#7C3AED" stroke-width="3"/>

    <!-- Mister A Character in Air -->
    <g transform="translate(80, 80) rotate(-15)">
      <!-- Giant Cape -->
      <path d="M 20,40 Q -30,60 -10,110 Q 20,90 35,60 Z" fill="#F59E0B" stroke="#1E293B" stroke-width="2"/>
      <!-- Head with Sunglasses -->
      <circle cx="45" cy="35" r="22" fill="#FED7AA" stroke="#1E293B" stroke-width="2.5"/>
      <rect x="30" y="28" width="32" height="12" rx="3" fill="#1E293B"/>
      <path d="M 38,47 Q 45,55 54,47" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
      <!-- Giant Letter "A" on suit -->
      <path d="M 25,55 L 65,55 L 55,120 L 35,120 Z" fill="#7C3AED" stroke="#1E293B" stroke-width="2.5"/>
      <text x="45" y="95" font-family="'Avenir Heavy', sans-serif" font-size="28" font-weight="900" fill="#FDE047" text-anchor="middle">A</text>
    </g>

    <!-- Sound effect -->
    <text x="30" y="210" class="bd-fx" font-size="22" fill="#7C3AED" transform="rotate(-6, 30, 210)">WOUHOU !</text>

    <!-- Speech bubble -->
    <g transform="translate(20, 15)">
      <path d="M 0,0 L 210,0 Q 220,0 220,10 L 220,42 Q 220,52 210,52 L 150,52 L 135,68 L 140,52 L 10,52 Q 0,52 0,42 Z" class="bd-bubble"/>
      <text x="15" y="24" class="bd-bubble-txt" font-weight="700">Pas de panique !</text>
      <text x="15" y="42" class="bd-bubble-txt">L'auxiliaire est dans la place !</text>
    </g>

    <!-- Frame -->
    <rect width="258" height="240" class="bd-frame" rx="4"/>
  </g>

  <!-- ================= CASE 4 (Résolution magique) ================= -->
  <g transform="translate(30, 524)">
    <rect width="540" height="230" fill="url(#magicGrad)" rx="4"/>

    <!-- Giant Glowing Text Banner -->
    <g transform="translate(270, 90)">
      <rect x="-240" y="-45" width="480" height="90" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" filter="url(#shadow)"/>
      <text x="0" y="-10" font-family="'Lexend', sans-serif" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">CONJUGAISON RÉUSSIE !</text>
      <text x="0" y="25" font-family="'Avenir Heavy', sans-serif" font-size="28" font-weight="900" fill="#1E293B" text-anchor="middle" letter-spacing="1">NOUS POUVONS CHANTER !</text>
    </g>

    <!-- Golden Stars Shower -->
    <g fill="#FDE047" stroke="#1E293B" stroke-width="1.5">
      <polygon points="60,35 63,44 72,44 65,50 67,59 60,53 53,59 55,50 48,44 57,44"/>
      <polygon points="120,180 123,189 132,189 125,195 127,204 120,198 113,204 115,195 108,189 117,189"/>
      <polygon points="460,40 463,49 472,49 465,55 467,64 460,58 453,64 455,55 448,49 457,49"/>
      <polygon points="500,175 503,184 512,184 505,190 507,199 500,193 493,199 495,190 488,184 497,184"/>
    </g>

    <!-- Final cheerful note -->
    <g transform="translate(190, 180)">
      <rect x="0" y="0" width="160" height="26" rx="13" class="bd-cap-bg"/>
      <text x="80" y="17" class="bd-cap-txt" text-anchor="middle">Fin de la leçon n°3 ★</text>
    </g>

    <!-- Frame -->
    <rect width="540" height="230" class="bd-frame" rx="4"/>
  </g>

  <!-- Footer numbering -->
  <text x="300" y="780" font-family="'Lexend', sans-serif" font-size="11" font-weight="600" fill="#92400E" text-anchor="middle">— 3 —</text>
</svg>

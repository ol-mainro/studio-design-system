<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <style>
      .bd-bg { fill: #0A0E1A; }
      .bd-frame { fill: none; stroke: #E63946; stroke-width: 3.5; stroke-linejoin: round; }
      .bd-panel-bg { fill: #111827; }
      .bd-cap-bg { fill: #E63946; stroke: #FFFFFF; stroke-width: 1.5; }
      .bd-cap-txt { font-family: 'Lexend', sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
      .bd-bubble { fill: #FFFFFF; stroke: #0A0E1A; stroke-width: 2.5; stroke-linejoin: round; }
      .bd-bubble-txt { font-family: 'Lexend', sans-serif; font-size: 11px; font-weight: 600; fill: #0A0E1A; }
      .bd-fx { font-family: 'Avenir Heavy', 'Impact', sans-serif; font-weight: 900; }
    </style>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Dark BD page background -->
  <rect width="600" height="800" class="bd-bg"/>

  <!-- Header -->
  <text x="30" y="25" font-family="'Lexend', sans-serif" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1.5">SURHUMAINS · CHRONIQUES DE NÉOPOLIS</text>
  <text x="570" y="25" font-family="'Lexend', sans-serif" font-size="10" font-weight="700" fill="#E63946" text-anchor="end">PLANCHE 07</text>
  <line x1="30" y1="32" x2="570" y2="32" stroke="#334155" stroke-width="1"/>

  <!-- ================= CASE 1 (Vue plongeante ville nocturne) ================= -->
  <g transform="translate(30, 42)">
    <rect width="540" height="200" fill="url(#nightSky)" rx="4"/>

    <!-- City Skyline Silhouettes -->
    <path d="M 0,200 L 0,110 L 40,110 L 40,80 L 70,80 L 70,140 L 110,140 L 110,60 L 140,60 L 140,40 L 160,40 L 160,200 Z" fill="#030712"/>
    <path d="M 160,200 L 160,90 L 210,90 L 210,130 L 250,130 L 250,50 L 290,50 L 290,200 Z" fill="#0B132B"/>
    <path d="M 290,200 L 290,70 L 340,70 L 340,30 L 370,30 L 370,110 L 420,110 L 420,55 L 450,55 L 450,200 Z" fill="#030712"/>
    <path d="M 450,200 L 450,85 L 490,85 L 490,120 L 540,120 L 540,200 Z" fill="#0B132B"/>

    <!-- Glowing Windows -->
    <g fill="#FBBF24" opacity="0.6">
      <rect x="50" y="90" width="4" height="6"/>
      <rect x="58" y="90" width="4" height="6"/>
      <rect x="120" y="70" width="4" height="6"/>
      <rect x="128" y="70" width="4" height="6"/>
      <rect x="120" y="85" width="4" height="6"/>
      <rect x="230" y="140" width="4" height="6"/>
      <rect x="310" y="80" width="4" height="6"/>
      <rect x="350" y="45" width="4" height="6"/>
      <rect x="470" y="100" width="4" height="6"/>
    </g>

    <!-- Red Siren Beam -->
    <polygon points="500,200 480,20 540,20" fill="#EF4444" opacity="0.18"/>
    <circle cx="510" cy="20" r="8" fill="#EF4444"/>

    <!-- Caption box -->
    <rect x="15" y="15" width="280" height="26" rx="3" class="bd-cap-bg"/>
    <text x="25" y="32" class="bd-cap-txt">23h42. L'alarme de la tour centrale résonne.</text>

    <!-- Frame -->
    <rect width="540" height="200" class="bd-frame" rx="4"/>
  </g>

  <!-- ================= CASE 2 (Volt saute d'un toit) ================= -->
  <g transform="translate(30, 258)">
    <rect width="258" height="250" fill="#0F172A" rx="4"/>

    <!-- Lightning arcs -->
    <path d="M 120,20 L 140,70 L 115,85 L 150,140 L 130,155 L 180,220" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 60,60 L 80,100 L 70,110 L 95,150" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Hero Silhouette (Volt) in action pose -->
    <g transform="translate(70, 40)">
      <!-- Cape / Energy trail -->
      <path d="M 30,70 Q -10,130 5,180 Q 40,140 45,90 Z" fill="#E63946" opacity="0.9"/>
      <!-- Body -->
      <circle cx="60" cy="40" r="18" fill="#FDE047"/>
      <!-- Visor -->
      <path d="M 52,38 L 74,38 L 70,44 L 54,44 Z" fill="#38BDF8"/>
      <!-- Torso -->
      <path d="M 45,55 L 75,55 L 85,115 L 35,115 Z" fill="#0284C7"/>
      <!-- Lightning emblem on chest -->
      <polygon points="62,65 54,82 62,82 56,102 68,78 60,78" fill="#FBBF24"/>
      <!-- Legs dynamic jump -->
      <line x1="45" y1="115" x2="20" y2="170" stroke="#0284C7" stroke-width="10" stroke-linecap="round"/>
      <line x1="75" y1="115" x2="105" y2="155" stroke="#0284C7" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- Speech bubble -->
    <g transform="translate(15, 15)">
      <path d="M 0,0 L 210,0 Q 220,0 220,10 L 220,40 Q 220,50 210,50 L 60,50 L 45,65 L 50,50 L 10,50 Q 0,50 0,40 Z" class="bd-bubble"/>
      <text x="15" y="22" class="bd-bubble-txt">Écho, tu me reçois ?</text>
      <text x="15" y="38" class="bd-bubble-txt" font-weight="700">Je plonge dans le secteur 4 !</text>
    </g>

    <!-- Sound effect -->
    <text x="150" y="235" class="bd-fx" font-size="24" fill="#FBBF24" transform="rotate(-12, 150, 235)">BZZZT !</text>

    <!-- Frame -->
    <rect width="258" height="250" class="bd-frame" rx="4"/>
  </g>

  <!-- ================= CASE 3 (Gros plan antagoniste) ================= -->
  <g transform="translate(312, 258)">
    <rect width="258" height="250" fill="#18181B" rx="4"/>
    <rect width="258" height="250" fill="url(#fireGrad)" opacity="0.15" rx="4"/>

    <!-- Glowing eyes in the dark -->
    <g transform="translate(60, 80)">
      <!-- Mask silhouette -->
      <path d="M 20,40 Q 70,-10 120,40 Q 70,120 20,40 Z" fill="#09090B" stroke="#E63946" stroke-width="3"/>
      <!-- Glowing Red Eyes -->
      <ellipse cx="50" cy="50" rx="16" ry="7" fill="#EF4444" transform="rotate(15, 50, 50)"/>
      <circle cx="50" cy="50" r="4" fill="#FFFFFF"/>
      <ellipse cx="90" cy="50" rx="16" ry="7" fill="#EF4444" transform="rotate(-15, 90, 50)"/>
      <circle cx="90" cy="50" r="4" fill="#FFFFFF"/>
    </g>

    <!-- High-tech device interface -->
    <g transform="translate(25, 180)">
      <rect x="0" y="0" width="208" height="45" rx="6" fill="#27272A" stroke="#E63946" stroke-width="2"/>
      <text x="15" y="26" font-family="'Lexend', sans-serif" font-size="11" font-weight="700" fill="#EF4444">CHARGEURS SONIQUES : 98%</text>
      <circle cx="185" cy="22" r="6" fill="#22C55E"/>
    </g>

    <!-- Threat Bubble (Spiky) -->
    <g transform="translate(20, 15)">
      <polygon points="0,0 215,0 215,48 90,48 70,68 80,48 0,48" class="bd-bubble"/>
      <text x="12" y="22" class="bd-bubble-txt" font-weight="700">Trop tard, Volt...</text>
      <text x="12" y="38" class="bd-bubble-txt">L'onde de choc est irréversible !</text>
    </g>

    <!-- Frame -->
    <rect width="258" height="250" class="bd-frame" rx="4"/>
  </g>

  <!-- ================= CASE 4 (Impact et bris de verre) ================= -->
  <g transform="translate(30, 524)">
    <rect width="540" height="230" fill="url(#nightSky)" rx="4"/>

    <!-- Shattered Glass Shards -->
    <g fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.5" opacity="0.8">
      <polygon points="120,40 180,80 140,110"/>
      <polygon points="210,30 260,20 240,70"/>
      <polygon points="340,60 410,30 380,90"/>
      <polygon points="430,90 490,140 440,160"/>
      <polygon points="80,140 130,160 90,190"/>
      <polygon points="270,150 320,130 310,180"/>
    </g>

    <!-- Radial Impact shockwave -->
    <circle cx="270" cy="115" r="50" fill="none" stroke="#F59E0B" stroke-width="4" opacity="0.8"/>
    <circle cx="270" cy="115" r="90" fill="none" stroke="#EF4444" stroke-width="3" opacity="0.6"/>
    <circle cx="270" cy="115" r="130" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.4"/>

    <!-- Giant Impact Sound Effect -->
    <g transform="translate(270, 125)">
      <polygon points="-160,-35 -40,-50 150,-40 70,-10 180,20 50,45 -80,55 -50,15 -140,25" fill="#EF4444" stroke="#FFFFFF" stroke-width="3"/>
      <text x="0" y="16" class="bd-fx" font-size="42" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">KRAAAK !</text>
    </g>

    <!-- Narrative Cliffhanger -->
    <g transform="translate(340, 185)">
      <rect x="0" y="0" width="185" height="26" rx="3" class="bd-cap-bg"/>
      <text x="10" y="17" class="bd-cap-txt">À SUIVRE DANS L'ÉPISODE 2...</text>
    </g>

    <!-- Frame -->
    <rect width="540" height="230" class="bd-frame" rx="4"/>
  </g>

  <!-- Footer numbering -->
  <text x="300" y="780" font-family="'Lexend', sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">— 7 —</text>
</svg>
